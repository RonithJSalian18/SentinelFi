name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: sentinelfi-backend

jobs:
  backend:
    name: Backend · lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Build native C++ AML engine
        run: python setup.py build_ext --inplace

      - name: Run test suite
        env:
          REQUIRE_NATIVE_ENGINE: "1" # fail if the C++ engine silently fell back to Python
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/test-results.xml
            backend/coverage.xml

  frontend:
    name: Frontend · lint, type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker · build, smoke-test & push
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Username is a repository *variable*: job outputs that contain secrets are blanked by
      # GitHub, which would strip the image reference handed to the deploy job.
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      # Publish only from main, and only once Docker Hub credentials are configured
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    outputs:
      published: ${{ env.PUBLISH }}
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -e GEMINI_API_KEY=ci-placeholder \
            ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/ && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:8000/ | grep -q '"version":"${{ github.sha }}"'
          # The image must ship the compiled C++ engine, not the Python fallback
          curl -fsS http://localhost:8000/aml/engine | tee /dev/stderr | grep -q '"engine":"cpp"'
          # ...and the WAF must be live
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8000/?q=DROP%20TABLE%20users')" = 403
          curl -fsS -X POST http://localhost:8000/aml/seed-dummy-data
          curl -fsS http://localhost:8000/aml/detect-circular-trading | grep -q threat_detected

      - name: Container logs
        if: failure()
        run: docker logs smoke

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: env.PUBLISH == 'true'
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha

      - name: Record pushed image
        if: env.PUBLISH == 'true'
        id: push
        run: echo "image=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy · Render
    needs: docker
    if: needs.docker.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Trigger Render deploy of the exact image digest
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          image=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${{ needs.docker.outputs.image }}")
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${image}"

      - name: Skip notice
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set; image pushed but not deployed."

      - name: Wait for the new version to go live
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.PRODUCTION_URL != ''
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${PRODUCTION_URL}/" | grep -q '"version":"${{ github.sha }}"'; then
              echo "Version ${{ github.sha }} is live at ${PRODUCTION_URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployment did not report version ${{ github.sha }} within 10 minutes"
          exit 1
