# Local stack: API + Celery worker + Redis broker + MinIO (S3-compatible document store).
# PostgreSQL and the Gemini key come from backend/.env (DATABASE_URL, GEMINI_API_KEY).
# MinIO console: http://localhost:9001 (sentinelfi / sentinelfi-secret)
x-backend-env: &backend-env
  REDIS_URL: redis://redis:6379/0
  S3_BUCKET: sentinelfi-kyc-documents
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: sentinelfi
  AWS_SECRET_ACCESS_KEY: sentinelfi-secret

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sentinelfi
      MINIO_ROOT_PASSWORD: sentinelfi-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot job: create the private, versioned document bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 sentinelfi sentinelfi-secret; do sleep 1; done;
      mc mb --ignore-existing local/sentinelfi-kyc-documents;
      mc version enable local/sentinelfi-kyc-documents;
      mc anonymous set none local/sentinelfi-kyc-documents
      "

  api:
    build: ./backend
    env_file: ./backend/.env
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - minio-init

  worker:
    build: ./backend
    command: celery -A tasks worker --loglevel=info --concurrency=2
    env_file: ./backend/.env
    environment: *backend-env
    depends_on:
      - redis
      - minio-init

volumes:
  minio-data:
